<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GraphIDS Alerts</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2630;
      --muted: #667085;
      --line: #d9dee7;
      --surface: #f6f8fb;
      --alert: #b42318;
      --ok: #087443;
    }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: white;
    }
    header {
      border-bottom: 1px solid var(--line);
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 700;
    }
    main {
      padding: 24px 28px;
      max-width: 1180px;
      margin: 0 auto;
    }
    .status {
      color: var(--muted);
      font-size: 14px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: var(--surface);
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .metric strong {
      font-size: 22px;
      line-height: 1.2;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      background: white;
      position: sticky;
      top: 0;
    }
    .score {
      color: var(--alert);
      font-weight: 700;
    }
    .empty {
      color: var(--muted);
      padding: 26px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>GraphIDS Alerts</h1>
    <div class="status" id="status">Waiting for alerts_state.json</div>
  </header>
  <main>
    <section class="metrics">
      <div class="metric"><span>Processed flows</span><strong id="processed">0</strong></div>
      <div class="metric"><span>Alerts</span><strong id="alerts">0</strong></div>
      <div class="metric"><span>True attacks seen</span><strong id="attacks">0</strong></div>
      <div class="metric"><span>True-positive lag ms</span><strong id="lag">-</strong></div>
      <div class="metric"><span>Conflict to consistent ms</span><strong id="conflict">-</strong></div>
    </section>
    <table>
      <thead>
        <tr>
          <th>Replay index</th>
          <th>Flow time</th>
          <th>Source</th>
          <th>Destination</th>
          <th>Score</th>
          <th>True label</th>
          <th>Attack</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="7" class="empty">No alerts yet.</td></tr>
      </tbody>
    </table>
  </main>
  <script>
    const fmt = new Intl.NumberFormat();
    const setText = (id, value) => {
      document.getElementById(id).textContent = value === null || value === undefined ? "-" : fmt.format(value);
    };

    async function refresh() {
      try {
        const response = await fetch("outputs/alerts_state.json?ts=" + Date.now());
        if (!response.ok) throw new Error(response.statusText);
        const state = await response.json();
        const summary = state.summary || {};
        setText("processed", summary.processed_flows);
        setText("alerts", summary.alert_count);
        setText("attacks", summary.true_attack_count_seen || summary.true_attack_count);
        setText("lag", summary.first_true_positive_detection_lag_ms ?? summary.first_detection_lag_ms);
        setText("conflict", summary.first_conflict_to_consistent_delay_ms);
        document.getElementById("status").textContent = "Updated " + state.updated_at;

        const alerts = state.recent_alerts || [];
        const rows = document.getElementById("rows");
        if (alerts.length === 0) {
          rows.innerHTML = '<tr><td colspan="7" class="empty">No alerts yet.</td></tr>';
          return;
        }
        rows.innerHTML = alerts.slice().reverse().map(alert => `
          <tr>
            <td>${alert.replay_index}</td>
            <td>${alert.flow_start_ms}</td>
            <td>${alert.src_ip}</td>
            <td>${alert.dst_ip}</td>
            <td class="score">${Number(alert.score).toFixed(8)}</td>
            <td>${alert.true_label}</td>
            <td>${alert.attack}</td>
          </tr>
        `).join("");
      } catch (error) {
        document.getElementById("status").textContent = "Waiting for replay output";
      }
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
